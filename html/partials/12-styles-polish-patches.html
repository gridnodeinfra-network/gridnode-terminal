<style id="gn-pretester-brand-csv-results-correction-v1">

/* ===== GRID//NODE Boot Redesign v2 (Cyberpunk Terminal Stream) ===== */
.boot-b2b-symbol-wrap{ position:relative; }
.boot-b2b-symbol-wrap::after{
  content:'';
  position:absolute;
  left:50%; top:50%;
  width:46%; height:46%;
  border:1.5px solid var(--red);

  transform:translate(-50%,-50%) scale(0);

  pointer-events:none;
}
@keyframes gnBootRing{
  0%{transform:translate(-50%,-50%) scale(0.4); opacity:0.9;}
  100%{transform:translate(-50%,-50%) scale(2.6); opacity:0;}
}
.boot-b2b-symbol{
  animation:gnSymPulse 1.8s ease-in-out infinite;
}
@keyframes gnSymPulse{
  0%,100%{filter:drop-shadow(0 0 16px rgba(0,229,255,.5));}
  50%{filter:drop-shadow(0 0 28px rgba(0,229,255,.8));}
}
.boot-terminal{
  max-width:342px !important;
  min-height:188px !important;
  border-color:rgba(0,212,255,.22) !important;

  box-shadow:inset 0 0 0 1px rgba(255,255,255,.035),0 18px 45px rgba(0,0,0,.45),0 0 30px rgba(0,212,255,.055) !important;
  padding:14px !important;
  position:relative;
  overflow:hidden;
  font-family:var(--font-m);
  font-size:.6rem;
  line-height:1.62;
  color:#8fbecb;
  text-align:left;
}
.boot-terminal::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,.085),transparent);
  transform:translateX(-100%);
  animation:gnBootScan 2.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes gnBootScan{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.boot-hud-title{
  font-family:var(--font-m);
  font-size:.58rem;
  letter-spacing:2.5px;
  color:#a8dce8;
  margin-bottom:8px;
  text-transform:uppercase;
}

  display:block;
  white-space:nowrap;
  overflow:hidden;
  opacity:0;
  transition:opacity .25s ease;

.boot-log-line.show{ opacity:1; }
.boot-log-key{ color:#00E6F0; }
.boot-log-ok{ color:#05FFA1; }
.boot-log-warn{ color:#ffb74d; }
.boot-log-cursor{
  display:inline-block;
  width:6px; height:.85em;
  background:#05FFA1;
  margin-left:2px;
  vertical-align:text-bottom;
  animation:gnCursor 1s steps(2) infinite;
}
@keyframes gnCursor{50%{opacity:0;}}
/* Old module grid kept as fallback in case GN_BOOT_MODULES still references it */
.boot-hud-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.boot-hud-module{
  border:1px solid rgba(0,212,255,.13);
  background:rgba(0,0,0,.22);
  padding:8px 9px;
  border-radius:4px;
  min-height:38px;
  display:none;
}
/* Cyberpunk 2077 yellow segmented progress bar — replaces flat green stripe */
.boot-prog-track{
  height:14px !important;
  border:1px solid rgba(255,182,39,.45) !important;
  background:rgba(255,182,39,.06) !important;
  padding:2px !important;
  display:flex !important;
  gap:3px !important;
  overflow:hidden !important;
  position:relative !important;
}
.boot-prog-fill{
  transition:none !important;
  background:transparent !important;
  box-shadow:none !important;
  height:100% !important;
  width:100% !important;
  display:contents !important;
}
.boot-prog-seg{
  flex:1;
  background:rgba(255,182,39,.08);
  border:1px solid rgba(255,182,39,.22);
  transition:background 90ms linear, box-shadow 90ms linear, border-color 90ms linear;
}
.boot-prog-seg.on{
  background:#ffb627;
  border-color:#ffb627;
  box-shadow:0 0 6px rgba(255,182,39,.75), inset 0 0 3px rgba(255,255,255,.35);
}
.boot-prog-seg.on.lead{
  background:#ffd866;
  box-shadow:0 0 12px rgba(255,182,39,1), 0 0 22px rgba(255,182,39,.5), inset 0 0 5px rgba(255,255,255,.6);
}
.boot-prog-pct{
  font-size:.58rem !important;
  color:#ffb627 !important;
  text-align:center !important;
  letter-spacing:2px !important;
  text-transform:uppercase;
  margin-top:8px !important;
  font-family:var(--font-m) !important;
  text-shadow:0 0 8px rgba(255,182,39,.55);
  font-variant-numeric:tabular-nums;
}

/* CSV zero-valid-record polish */
.csv-import-save[disabled],
.csv-import-save.disabled{
  opacity:.38;
  cursor:not-allowed;
  filter:saturate(.45);
  box-shadow:none !important;
}
.csv-import-blocker{
  display:block;

}
.csv-import-warn{

/* RESULTS verified trend readability */
.results-direction{color:#bdd3de !important}
.results-direction.falling{color:#88f2c2 !important}
.results-direction.rising{color:#ff9aae !important}
.results-direction.stable{color:#a8dce8 !important}
.results-direction.insufficient{color:#9eb3c1 !important}
</style>

<style id="shots-full-polish-v1">
/* ═══ SHOTS full-flow premium polish: modal, next-shot card, history ═══ */

/* --- Modal chrome: 44px touch targets, press feedback --- */
.modal-btn{width:44px;height:44px}
.modal-btn:active{transform:scale(.94)}
.modal-btn.save:active{transform:scale(.94);box-shadow:0 0 22px var(--red-glow)}

/* Overlay fade-in (was an instant cut) */
.overlay.active{animation:gnOverlayFade .22s ease-out}
@keyframes gnOverlayFade{from{opacity:0}to{opacity:1}}

/* --- Form rhythm: airier groups, consistent 48px inputs --- */
#logOv .form-group{margin-bottom:20px}
#logOv .form-input,#logOv .form-textarea{min-height:48px}
#logOv .form-label{margin-bottom:8px}

/* Medication trigger: full 48px target, clearer affordance */
.cp-select-trigger{min-height:48px}
.cp-select-trigger:hover{border-color:rgba(0,212,255,.4)}
.cp-select-trigger .cp-select-arrow{color:var(--cyan);font-size:.7rem}

/* --- Dose pills: real touch targets, premium active state --- */
.dose-pill{min-height:44px;display:inline-flex;align-items:center;padding:10px 18px;font-size:.72rem}
.dose-pill.active{box-shadow:0 0 12px rgba(0,212,255,.25),inset 0 0 8px rgba(0,212,255,.12)}
.dose-pill:active{transform:scale(.96)}

/* --- AM/PM: press feedback --- */
#logOv .gn-ampm-btn{transition:all .18s ease}
#logOv .gn-ampm-btn:active{transform:scale(.94)}

/* --- Side effects: taller rows, bigger checkboxes, checked state --- */
.se-grid{gap:8px}
.se-check{padding:12px 14px;min-height:52px}
.se-check input{width:20px;height:20px;flex-shrink:0;cursor:pointer}
.se-check:focus-within{border-color:rgba(0,212,255,.5);box-shadow:0 0 0 2px rgba(0,212,255,.15)}
.se-check:has(input:checked){border-color:rgba(255,59,59,.45);background:rgba(255,59,59,.07);color:var(--text)}
.se-check:active{transform:scale(.98)}

/* --- Advanced trigger + location action: 48px targets --- */
.gn-shot-advanced-trigger{min-height:48px;padding:12px 14px}
.log-location-action{min-height:48px;transition:all .18s ease}
.log-location-action:hover{border-color:rgba(0,212,255,.6);background:rgba(0,212,255,.10);box-shadow:0 0 14px rgba(0,212,255,.12)}

/* --- Next-shot card: tighter hierarchy, dose pill alignment --- */
.next-shot-card{padding:18px 16px;position:relative;overflow:hidden}
.next-shot-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);box-shadow:0 0 10px var(--red-glow)}
.nsc-label{margin-bottom:8px}
.nsc-shot{margin-bottom:6px;line-height:1.35}
.nsc-dose{vertical-align:middle;white-space:nowrap}
.nsc-site{margin-top:8px;letter-spacing:1.5px;line-height:1.6}

/* --- History: airier entries, 36px action targets, readable chips --- */
.log-entry{padding:16px;margin-bottom:10px}
.log-entry-top{margin-bottom:10px}
.log-action-btn{width:36px;height:36px}
.log-action-btn:active{transform:scale(.92)}
.log-entry:not(.archived-record) .log-action-btn{min-height:40px}
.log-chips{gap:6px;margin-top:6px}
.log-chip{padding:5px 10px;font-size:.55rem}
.log-notes{line-height:1.6}

/* Empty state CTA: full-width premium button */
.empty-cta{margin-top:14px;min-height:52px;font-size:.8rem;letter-spacing:2.5px}

/* Reduced motion: kill the new entrance animations too */
@media (prefers-reduced-motion:reduce){
  .overlay.active{animation:none}
  .log-entry{animation:none}
}
</style>
