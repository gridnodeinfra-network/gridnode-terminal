<style id="gn-critical-legacy">
/* Critical subset of css/native/12-legacy-externalized.css (HTML diet,
 * 2026-10-13): the legacy rules that style first-paint surfaces (landing,
 * boot, login, global base, and the hidden-state base rules of every
 * body-level overlay (their display:none defaults must hold from the
 * first painted frame, before the async file lands)), extracted verbatim and in original order so
 * first paint is never gated on the full 370 KB legacy layer. The full file
 * below loads async and re-applies these same rules; this duplication is
 * the standard critical-CSS pattern. #app stays visibility-gated until the
 * full layer lands (or a 2.8s fallback), so no app screen can flash
 * unstyled. Do not edit here: edit the source file and re-extract. */
:root {
  --cyan:      #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.12);
  --cyan-glow: rgba(0,212,255,0.4);
  --red-hi: #FF5B5B;
  --red-lo: #D12424;
  --red:       #FF3B3B;
  --red-dim:   rgba(255,59,59,0.12);
  --red-glow: rgba(255, 59, 59, 0.35);
  --red-dim:  rgba(255,59,59,0.4);
  --green:     #00ff88;
  --green-dim: rgba(0,255,136,0.12);
  --yellow:    #ffd700;
  --cp-yellow: #FCEE0A;  /* Cyberpunk 2077 yellow, accent labels only */
  --yellow-dim:rgba(255,215,0,0.12);
  --orange:    #ff8c00;
  --magenta:   #ff00cc;
  /* S2 — TRUST GRAMMAR tokens. Semantics are structural (solid/dashed/outlined),
     never color-only. RECORDED = measured fact (cyan, solid). ESTIMATE = modeled
     or calculated (amber, dashed/segmented, approximate language). PLAN = user
     schedule or intended action (violet, outlined). STATUS = operational state. */
  --trust-recorded-accent: #00d4ff;
  --trust-recorded-border: rgba(0,212,255,.55);
  --trust-recorded-bg:     rgba(0,212,255,.07);
  --trust-estimate-accent: #ffb300;
  --trust-estimate-border: rgba(255,179,0,.55);
  --trust-estimate-bg:     rgba(255,179,0,.06);
  --trust-plan-accent:     #9d7bff;
  --trust-plan-border:     rgba(157,123,255,.55);
  --trust-plan-bg:         rgba(157,123,255,.06);
  --trust-status-ok:       #00ff88;
  --trust-status-warn:     #ffb300;
  --trust-status-err:      #ff5b5b;
  --trust-status-mute:     #9898b0;
  --bg:        #050508;
  --bg2:       #08080d;
  --panel:     #0e0e16;
  --panel2:    #121218;
  --panel3:    #161622;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);

}
