/* v0.15.19 BIOTECH SCANNER - synthetic diagnostic mannequin */
.biotech-scanner{
  position:relative;
  z-index:3;
  margin:14px auto 0;
  display:flex;
  flex-direction:column;
  gap:0;
}
.biotech-stage{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(6,187,227,0.06), transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(234,9,23,0.04), transparent 50%),
    linear-gradient(180deg, #02060a 0%, #050a10 50%, #02060a 100%);
  border-radius:14px;
  overflow:hidden;
  isolation:isolate;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
.biotech-stage[hidden]{
  display:none !important;
}
.biotech-stage-frame{
  position:absolute;
  inset:0;
  z-index:1;
}
.biotech-stage-glow{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 0%, rgba(0,0,0,0.45) 75%, rgba(0,0,0,0.85) 100%);
  pointer-events:none;
  z-index:3;
}
.biotech-asset{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
  pointer-events:none;
  -webkit-user-drag:none;
}
.biotech-zones{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  touch-action:pan-y;
}
/* Excluded center (navel) — hatched cross pattern */
.zone-excluded{
  fill:none;
  stroke:rgba(234,9,23,0.72);
  stroke-width:3;
  stroke-dasharray:9 7;
  pointer-events:none;
}
.zone-excluded::before{ /* fake diagonal hatching via fill */
  fill:url(#gnExcludeHatch);
}
/* Visible zone contour - thin red outline, transparent fill */
.zone-visible{
  fill:rgba(6,187,227,0.04);
  stroke:rgba(6,187,227,0.55);
  stroke-width:2.5;
  stroke-linejoin:round;
  pointer-events:none;
  transition:fill 180ms ease, stroke 180ms ease, stroke-width 180ms ease, opacity 180ms ease;
}
/* Hit area is invisible but receives pointer events */
.zone-hit{
  fill:transparent;
  stroke:transparent;
  cursor:pointer;
  outline:none;
  transition:filter 120ms ease;
}
.zone-hit:focus-visible{
  outline:2px solid #FCEE0A;
  outline-offset:2px;
}
/* IDLE: visible contour shows subtle cyan, hit area highlights on hover */
.zone-hit:hover ~ .zone-visible,
.biotech-stage:hover .zone-hit + .zone-visible{
  /* CSS sibling selector doesn't work for this; use direct path class instead */
}
/* Hover: visible contour brightens via JS-controlled :hover, fallback: */
.biotech-stage .zone-visible{
  filter:drop-shadow(0 0 4px rgba(6,187,227,0.25));
}
.biotech-stage .zone-hit:hover{
  filter:drop-shadow(0 0 6px rgba(6,187,227,0.4));
}
.zone-hit:hover + .zone-visible,
.zone-hit:focus-visible + .zone-visible{
  stroke:rgba(6,187,227,0.95);
  stroke-width:3;
  fill:rgba(6,187,227,0.12);
}
/* PRESSED: immediate response (added by JS on pointerdown) */
.zone-hit.pressed + .zone-visible{
  stroke:rgba(252,238,10,0.95);  /* Signal Yellow flash on touch */
  stroke-width:3.5;
  fill:rgba(252,238,10,0.18);
  transition:fill 0ms, stroke 0ms, stroke-width 0ms;
}
/* ACQUIRING: local scan pulse (added by JS, ~80-180ms) */
.zone-hit.zone-acquiring + .zone-visible{
  stroke:#FCEE0A;
  fill:rgba(234,9,23,0.10);
  animation:biotechAcquiring 220ms ease-out;
}
.zone-hit.zone-acquiring::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
}
@keyframes biotechAcquiring{
  0%   { fill:rgba(252,238,10,0.32); stroke-width:4; }
  60%  { fill:rgba(234,9,23,0.20); stroke-width:3.5; }
  100% { fill:rgba(234,9,23,0.12); stroke-width:3; }
}
/* SELECTED: Mars Red pulse + locked state */
.zone-hit.selected + .zone-visible{
  fill:rgba(234,9,23,0.22);
  stroke:#EA0917;
  stroke-width:3.5;
  filter:drop-shadow(0 0 12px rgba(234,9,23,0.6));
}
.zone-hit.selected-active + .zone-visible{
  animation:biotechPulse 320ms ease-out;
}
@keyframes biotechPulse{
  0%   { fill:rgba(252,238,10,0.40); stroke-width:5; }
  50%  { fill:rgba(234,9,23,0.35); stroke-width:4; }
  100% { fill:rgba(234,9,23,0.22); stroke-width:3.5; }
}
/* LAST: most recent - amber accent */
.zone-hit.last + .zone-visible{
  fill:rgba(252,238,10,0.10);
  stroke:rgba(252,238,10,0.85);
  stroke-width:2.5;
  stroke-dasharray:8 3;
}
/* RECENT: recently logged - subtle cyan */
.zone-hit.recent + .zone-visible{
  fill:rgba(6,187,227,0.06);
  stroke:rgba(6,187,227,0.5);
  stroke-width:2;
  stroke-dasharray:4 2;
}
/* DIM: unselected zones in active mode after a selection exists */
.zone-hit.is-dim + .zone-visible{
  opacity:0.35;
  filter:none;
}
/* Frame corners */
.biotech-corner{
  position:absolute;
  width:18px;
  height:18px;
  border:1.5px solid #06BBE3;
  pointer-events:none;
  z-index:4;
}
.biotech-corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
.biotech-corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
.biotech-corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
.biotech-corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; }
/* Scanline sweep on stage entry */
.biotech-scanline{
  position:absolute;
  left:0; right:0; top:0;
  height:2px;
  background:linear-gradient(90deg, transparent, #06BBE3 50%, transparent);
  box-shadow:0 0 12px 2px rgba(6,187,227,0.6);
  opacity:0;
  pointer-events:none;
  z-index:5;
  transform:translateY(0);
}
.biotech-scanline.sweep{
  animation:biotechSweep 600ms ease-out;
}
@keyframes biotechSweep{
  0%   { opacity:0.95; transform:translateY(0); }
  85%  { opacity:0.4; transform:translateY(98%); }
  100% { opacity:0; transform:translateY(100%); }
}
/* Debug mode outlines */
.zone-hit.debug-on{
  fill:rgba(252,238,10,0.04);
  stroke:rgba(252,238,10,0.4);
  stroke-width:1;
  stroke-dasharray:3 2;
}
.zone-hit.debug-on + .zone-visible{
  fill:rgba(6,187,227,0.04);
  stroke:rgba(6,187,227,0.85);
  stroke-width:2;
  stroke-dasharray:5 3;
}
/* Locked confirmation pulse on the panel */
.gn-zone-confirmed{
  animation:gnZoneConfirmed 900ms ease-out;
}
@keyframes gnZoneConfirmed{
  0%   { box-shadow:0 0 0 0 rgba(234,9,23,0.5); }
  50%  { box-shadow:0 0 0 8px rgba(234,9,23,0.15); }
  100% { box-shadow:0 0 0 0 rgba(234,9,23,0); }
}
.gn-location-lock{
  display:flex;
  align-items:baseline;
  gap:8px;
  padding:6px 8px;
  border-left:2px solid #EA0917;
  background:rgba(234,9,23,0.06);

.gn-location-lock.is-on{

}
.gn-location-lock small{

/* Reduced motion: strip animations, keep state visuals */
@media (prefers-reduced-motion: reduce){
  .biotech-scanline,
  .biotech-stage,
  .zone-visible,
  .zone-hit,
  .gn-zone-confirmed{
    animation-duration:0ms !important;

  }
  .biotech-scanline.sweep{ display:none; }
}

.asset-scan-stage::before,
.asset-scan-stage::after{
  content:none;
}
.scan-asset{
  position:absolute;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  pointer-events:none;
  user-select:none;
}
.clean-zone-layer{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
}
.zone-overlay{
  --switch-color:var(--cyan);
  position:absolute;
  z-index:5;
  display:block;
  padding:0;
  border:0;
  border-radius:14px;
  background:transparent;
  color:var(--switch-color);
  outline:0;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  pointer-events:auto;
  opacity:0;
  transition:opacity .18s ease, filter .18s ease;
}
.zone-overlay[hidden]{display:none!important}
.zone-overlay::before,
.zone-overlay::after{
  content:"";
  position:absolute;
  pointer-events:none;
  opacity:0;
}

/* Hitboxes are invisible by default. The 14154 asset carries the visible zone language. */
.zone-overlay::before{
  inset:-5px;
  border-radius:18px;
  background:radial-gradient(circle at 50% 50%, currentColor 0%, rgba(0,0,0,0) 64%);
  filter:blur(9px);
  mix-blend-mode:screen;
}
.zone-overlay::after{
  width:17px;
  height:17px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid currentColor;
  box-shadow:0 0 10px currentColor, inset 0 0 8px color-mix(in srgb, currentColor 30%, transparent);
  background:radial-gradient(circle, currentColor 0 2px, transparent 3px);
}

/* Non-active mode zones must not visually dominate, even if selected in data. */
.zone-overlay.mode-muted,
.zone-overlay.selected-memory{
  opacity:0!important;
  pointer-events:none;
}
.zone-overlay.mode-muted::before,
.zone-overlay.mode-muted::after,
.zone-overlay.selected-memory::before,
.zone-overlay.selected-memory::after{
  opacity:0!important;
}

/* Active filter zones get only a subtle scan halo. */
.asset-scan-stage.mode-core .zone-overlay[data-mode="core"],
.asset-scan-stage.mode-lower .zone-overlay[data-mode="lower"],
.asset-scan-stage.mode-upper .zone-overlay[data-mode="upper"]{
  opacity:1;
}
.asset-scan-stage.mode-core .zone-overlay[data-mode="core"]::before,
.asset-scan-stage.mode-lower .zone-overlay[data-mode="lower"]::before,
.asset-scan-stage.mode-upper .zone-overlay[data-mode="upper"]::before{
  opacity:.10;
}
.asset-scan-stage.mode-core .zone-overlay[data-mode="core"]::after,
.asset-scan-stage.mode-lower .zone-overlay[data-mode="lower"]::after,
.asset-scan-stage.mode-upper .zone-overlay[data-mode="upper"]::after{
  opacity:.18;
}

/* Status accents are restrained and mode-aware. */
.zone-overlay.ready:not(.selected){
  --switch-color:var(--green);
}
.zone-overlay.last:not(.selected){
  --switch-color:var(--yellow);
}
.zone-overlay.recent:not(.selected){
  --switch-color:var(--magenta);
}
.zone-overlay.ready:not(.selected)::before,
.zone-overlay.last:not(.selected)::before,
.zone-overlay.recent:not(.selected)::before{
  opacity:.16;
}
.zone-overlay.ready:not(.selected)::after,
.zone-overlay.last:not(.selected)::after,
.zone-overlay.recent:not(.selected)::after{
  opacity:.28;
}

/* Selected state enhances the existing 14154 panel instead of drawing a new fake capsule. */
.zone-overlay.selected-active{
  --switch-color:var(--cyan);
  opacity:1!important;
  filter:brightness(1.08);
}
.zone-overlay.selected-active::before{
  opacity:.36!important;
  filter:blur(11px);
  animation:regionHaloBreath 2.35s ease-in-out infinite;
}
.zone-overlay.selected-active::after{

/* ═══════════════════════════════════════════════
   SCANNER SELECTION UX POLISH v2
   Selected-state no longer uses floating tap markers.
   The selected trackable zone itself carries the lock state.
═══════════════════════════════════════════════ */
.zone-overlay{
  isolation:isolate;
}

/* Remove/minimize floating dot/ring marker from previous polish. */
.zone-overlay::after{
  left:0!important;
  top:0!important;
  right:0!important;
  bottom:0!important;
  width:auto!important;
  height:auto!important;
  transform:none!important;
  border-radius:inherit!important;
  border:0!important;
  box-shadow:none!important;
  background:
    linear-gradient(90deg,transparent 0%,rgba(0,212,255,.00) 35%,rgba(0,212,255,.34) 50%,rgba(0,212,255,.00) 65%,transparent 100%)!important;
  opacity:0!important;
  pointer-events:none!important;
}

/* Available zones: subtle dormant biotech-zone visibility, not medical panels. */
.asset-scan-stage.mode-core .zone-overlay[data-mode="core"]::before,
.asset-scan-stage.mode-lower .zone-overlay[data-mode="lower"]::before,
.asset-scan-stage.mode-upper .zone-overlay[data-mode="upper"]::before{
  inset:0!important;
  border-radius:inherit!important;
  opacity:.18!important;
  border:1px solid rgba(255,0,204,.18);
  background:
    linear-gradient(90deg,rgba(255,0,204,.055) 0 1px,transparent 1px 7px),
    linear-gradient(0deg,rgba(0,212,255,.045) 0 1px,transparent 1px 8px),
    radial-gradient(circle at 50% 50%,rgba(255,0,204,.12),rgba(0,212,255,.04) 48%,transparent 72%)!important;
  filter:drop-shadow(0 0 8px rgba(255,0,204,.16))!important;
  mix-blend-mode:screen!important;
}

/* Prior marker behavior must never return. */
.zone-overlay.selected-active::after{
  opacity:0!important;
  animation:none!important;
}

/* Selected state: lock the region area itself with magenta density + thin cyan edge. */
.zone-overlay.selected-active::before{
  inset:-1px!important;
  opacity:.72!important;
  border:1.5px solid rgba(0,212,255,.74)!important;
  background:
    linear-gradient(90deg,rgba(0,212,255,.00),rgba(0,212,255,.20),rgba(0,212,255,.00)),
    linear-gradient(90deg,rgba(255,0,204,.10) 0 1px,transparent 1px 6px),
    linear-gradient(0deg,rgba(0,212,255,.08) 0 1px,transparent 1px 7px),
    radial-gradient(circle at 50% 50%,rgba(255,0,204,.26),rgba(0,212,255,.12) 48%,transparent 76%)!important;
  filter:drop-shadow(0 0 12px rgba(0,212,255,.36)) drop-shadow(0 0 16px rgba(255,0,204,.18))!important;
  box-shadow:inset 0 0 18px rgba(0,212,255,.16), 0 0 16px rgba(0,212,255,.22);
  animation:zoneLockBreathV2 2.6s ease-in-out infinite!important;
}

/* One-shot confirmation layer appears as region sweep, not point marker. */
.zone-overlay.zone-confirming::after{
  opacity:.62!important;
  animation:zoneSweepOnceV2 .48s ease-out 1!important;
}

.zone-overlay.zone-confirming::before{
  animation:zoneLockConfirmV2 .48s ease-out 1, zoneLockBreathV2 2.6s ease-in-out infinite!important;
}

@keyframes zoneLockBreathV2{
  0%,100%{opacity:.56;filter:drop-shadow(0 0 10px rgba(0,212,255,.26)) drop-shadow(0 0 13px rgba(255,0,204,.15))}
  50%{opacity:.78;filter:drop-shadow(0 0 15px rgba(0,212,255,.42)) drop-shadow(0 0 18px rgba(255,0,204,.22))}
}
@keyframes zoneSweepOnceV2{
  0%{transform:translateX(-115%);opacity:0}
  16%{opacity:.58}
  100%{transform:translateX(115%);opacity:0}
}
@keyframes zoneLockConfirmV2{
  0%{transform:scale(.985);opacity:.35}
  42%{transform:scale(1.025);opacity:.86}
  100%{transform:scale(1);opacity:.62}
}

/* Subtle panel prominence after selection; keeps source-of-truth visible. */
.scanner-selected-panel.zone-locked{
  border-color:rgba(0,212,255,.46)!important;
  background:
    radial-gradient(circle at 12% 0%,rgba(0,212,255,.13),transparent 42%),
    linear-gradient(135deg,rgba(0,212,255,.095),rgba(0,0,0,.25))!important;
  box-shadow:0 0 20px rgba(0,212,255,.13), inset 0 0 18px rgba(0,212,255,.05)!important;
}
.scanner-selected-panel .panel-location{

}
.scanner-selected-panel .panel-empty{

  font-family:var(--font-b);

  line-height:1.35;
}


/* ═══════════════════════════════════════════════
   SCANNER CANONICAL ASSET SYNC v4
   Body-perspective mapping + CORE/LOWER hitbox precision.
   Prep-only: no overlays, no selected-state FX.
═══════════════════════════════════════════════ */
.asset-scan-stage,
.asset-scan-stage.mode-core,
.asset-scan-stage.mode-lower,
.asset-scan-stage.mode-upper{
  aspect-ratio:2 / 3 !important;
}
.asset-scan-stage.mode-core .zone-overlay:not([data-mode="core"]),
.asset-scan-stage.mode-lower .zone-overlay:not([data-mode="lower"]),
.asset-scan-stage.mode-upper .zone-overlay:not([data-mode="upper"]){
  pointer-events:none !important;
  opacity:0 !important;
}
.asset-scan-stage.mode-core .zone-overlay[data-mode="core"],
.asset-scan-stage.mode-lower .zone-overlay[data-mode="lower"],
.asset-scan-stage.mode-upper .zone-overlay[data-mode="upper"]{
  pointer-events:auto !important;
}

/* CORE uses front-view body perspective:
   screen-left panel = Right Abdomen, screen-right panel = Left Abdomen.
   Hitboxes are tightened to the visible purple abdomen panels only. */
.zone-core-l{
  left:38.8% !important;
  top:36.6% !important;
  width:10.4% !important;
  height:10.8% !important;
  border-radius:18px 14px 16px 18px !important;
  clip-path:polygon(12% 4%,100% 0%,98% 92%,18% 100%,0% 82%,0% 18%) !important;
}
.zone-core-r{
  left:50.8% !important;
  top:36.6% !important;
  width:10.4% !important;
  height:10.8% !important;
  border-radius:14px 18px 18px 16px !important;
  clip-path:polygon(0% 0%,88% 4%,100% 18%,100% 82%,82% 100%,2% 92%) !important;
}

/* LOWER uses front-view body perspective:
   screen-left panel = Right Thigh, screen-right panel = Left Thigh.
   Tightened to the visible purple upper-thigh panels while preserving upper/middle/lower tap response. */
.zone-lower-l{
  left:31.2% !important;
  top:49.0% !important;
  width:15.0% !important;
  height:22.4% !important;
  border-radius:24px 34px 30px 20px !important;
  clip-path:polygon(18% 0%,88% 5%,100% 18%,92% 88%,70% 100%,6% 92%,0% 76%,2% 18%) !important;
}
.zone-lower-r{
  left:53.8% !important;
  top:49.0% !important;
  width:15.0% !important;
  height:22.4% !important;
  border-radius:34px 24px 20px 30px !important;
  clip-path:polygon(12% 5%,82% 0%,98% 18%,100% 76%,94% 92%,30% 100%,8% 88%,0% 18%) !important;
}

/* UPPER remains back-view body perspective and is intentionally unchanged except for active-mode isolation. */

.gn-syr-barrel{flex:1;height:30px;background:linear-gradient(180deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.1) 50%,rgba(255,255,255,0.05) 100%);border-top:1px solid rgba(0,229,255,0.4);border-bottom:1px solid rgba(0,229,255,0.4);position:relative;overflow:hidden}
.gn-syr-barrel::after{content:'';position:absolute;top:0;right:0;bottom:0;width:18px;background:linear-gradient(90deg,transparent 0%,rgba(255,130,0,0.12) 40%,rgba(255,130,0,0.4) 100%);border-left:1px solid rgba(255,130,0,0.5);z-index:5}
.gn-syr-u100{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:.38rem;color:#ff8200;letter-spacing:1px;font-weight:700;writing-mode:vertical-rl;text-orientation:mixed;z-index:6;opacity:.85}
.gn-syr-markings{position:absolute;top:0;bottom:0;left:0;right:18px;pointer-events:none;z-index:3}
.gn-syr-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,229,255,0.3);transition:background .3s,box-shadow .3s}
.gn-syr-tick.major{background:rgba(0,229,255,0.6)}
.gn-syr-tick.cascaded{background:var(--cyan);box-shadow:0 0 4px var(--cyan)}
.gn-syr-tick-label{position:absolute;top:100%;transform:translate(-50%,3px);font-size:.42rem;color:var(--cyan);font-variant-numeric:tabular-nums;letter-spacing:.5px;transition:color .3s,text-shadow .3s;white-space:nowrap}
.gn-syr-tick-label.cascaded{color:#fff;text-shadow:0 0 3px var(--cyan)}
.gn-syr-fluid{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(0,229,255,0.65) 0%,rgba(5,255,161,0.45) 60%,rgba(5,255,161,0.25) 100%);box-shadow:inset 0 0 6px rgba(5,255,161,0.4),0 0 8px rgba(0,229,255,0.3);transition:width .6s cubic-bezier(0.16,1,0.3,1);z-index:1;overflow:hidden}
.gn-syr-fluid::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:rgba(5,255,161,0.8);box-shadow:0 0 3px rgba(5,255,161,0.6)}
.gn-syr-motes{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.gn-syr-mote{position:absolute;width:1.5px;height:1.5px;background:var(--cyan);border-radius:50%;box-shadow:0 0 3px var(--cyan);opacity:.7;animation:gnSyrDrift 6s linear infinite}
@keyframes gnSyrDrift{0%{transform:translateY(-8px);opacity:0}10%{opacity:.8}90%{opacity:.8}100%{transform:translateY(40px);opacity:0}}
.gn-syr-stopper{position:absolute;top:2px;bottom:2px;width:4px;background:linear-gradient(180deg,#2a2a2a 0%,#000 50%,#2a2a2a 100%);border-left:1px solid rgba(0,229,255,0.5);border-right:1px solid rgba(0,229,255,0.5);transition:left .6s cubic-bezier(0.16,1,0.3,1);z-index:4}
.gn-syr-target{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffd700;box-shadow:0 0 6px rgba(255,215,0,0.9);z-index:5;transition:left .6s cubic-bezier(0.16,1,0.3,1);border-radius:1px}
.gn-syr-flange{width:8px;height:50px;background:linear-gradient(180deg,#1e1e2e 0%,#050508 50%,#1e1e2e 100);border:1px solid rgba(0,229,255,0.4);border-radius:2px;flex-shrink:0;position:relative;box-shadow:0 0 6px rgba(0,229,255,0.18)}
.gn-syr-flange::before,.gn-syr-flange::after{content:'';position:absolute;left:-2px;right:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6}
.gn-syr-flange::before{top:25%}
.gn-syr-flange::after{top:75%}
.gn-syr-rod{width:42px;height:6px;background:linear-gradient(180deg,#1e1e2e 0%,#050508 50%,#1e1e2e 100%);border-top:1px solid rgba(0,229,255,0.3);border-bottom:1px solid rgba(0,229,255,0.3);flex-shrink:0;position:relative}
.gn-syr-rod::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,transparent 46%,rgba(0,229,255,0.18) 50%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(0,229,255,0.18) 50%,transparent 54%);background-size:5px 5px}
.gn-syr-rod::after{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.3),transparent);transform:translateY(-50%)}
.gn-syr-thumb{width:24px;height:14px;background:linear-gradient(180deg,#2a2a3a 0%,#0a0a14 50%,#1a1a26 100%);border:1px solid rgba(0,229,255,0.45);border-radius:7px;flex-shrink:0;position:relative;box-shadow:inset 0 0 4px rgba(0,229,255,0.12),0 0 6px rgba(0,229,255,0.18)}
.gn-syr-thumb::before{content:'';position:absolute;inset:2px 4px;border-top:1px solid rgba(0,229,255,0.25);border-bottom:1px solid rgba(0,229,255,0.25);border-radius:4px}
.gn-syr-thumb::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:3px;background:#FF3B3B;border-radius:50%;box-shadow:0 0 4px rgba(255,42,109,0.9);animation:gnSyrPulse 2s ease-in-out infinite}
@keyframes gnSyrPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.4);opacity:.6}}
.gn-syr-scale-bottom{margin-top:8px;display:flex;justify-content:space-between;padding:0 30px 0 28px;font-size:.48rem;color:#6a7080;letter-spacing:1.5px;font-variant-numeric:tabular-nums;position:relative}

.gn-syr-caution{margin-top:6px;padding:7px 11px;background:rgba(0,229,255,0.04);border-left:2px solid rgba(0,229,255,0.4);font-size:.62rem;color:#8a8a9a;line-height:1.4}
.gn-syr-pk{display:flex;align-items:center;gap:6px;margin-top:10px;padding:6px 8px;background:rgba(0,0,0,0.5);border:1px solid var(--cyan);border-radius:4px;box-shadow:0 0 8px rgba(0,229,255,0.3)}
.gn-syr-pk-line{width:36px;height:1px;background:repeating-linear-gradient(90deg,var(--cyan) 0,var(--cyan) 3px,transparent 3px,transparent 6px);box-shadow:0 0 3px rgba(0,229,255,0.6);flex-shrink:0}
.gn-syr-pk-hud{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:2px 10px;font-size:.5rem;letter-spacing:1.2px;line-height:1.4}

.gn-syr-pk-hud .k{color:#6a7080;font-size:.45rem}
.gn-syr-pk-hud .v{color:var(--cyan);font-variant-numeric:tabular-nums;font-weight:500}
.gn-syr-pk-hud .v.peak{color:#FF3B3B}
.gn-syr-helper{margin-top:10px}
.gn-syr-helper summary{font-size:.6rem;color:var(--cyan);letter-spacing:2px;cursor:pointer;padding:3px 0}
.gn-syr-helper p{font-size:.68rem;color:#c0c5d0;line-height:1.5;margin-top:5px}
.gn-syr-helper b{color:#05ffa1}
.gn-syr-safety{color:#8a8a9a!important;font-style:italic;border-top:1px solid rgba(0,229,255,0.1);padding-top:6px;margin-top:8px;font-size:.6rem}
.gn-syr-forensic{margin-top:12px;padding-top:8px;border-top:1px solid rgba(0,229,255,0.1);display:flex;justify-content:space-between;align-items:center;font-size:.48rem;color:#4a5060;letter-spacing:1.2px;line-height:1.5}

.gn-syr-forensic .k{color:#3a4050}

.syringe-visual:hover .gn-syr-oskar{color:rgba(255,42,109,0.55)}
@media (max-width:600px){.gn-syr-hero{grid-template-columns:1fr;gap:14px;overflow:hidden;align-items:start}.gn-syr-meta{text-align:left;border-top:1px solid var(--border);padding-top:10px;margin-top:4px}.gn-syr-num{font-size:3.4rem;letter-spacing:-1.5px;line-height:1}.gn-syr-u{font-size:.9rem}.gn-syr-body{height:80px}.gn-syr-thumb{width:22px;height:12px}.gn-syr-rod{width:38px;height:5px}.gn-syr-flange{height:42px;width:7px}.gn-syr-hub{width:11px;height:16px}.gn-syr-hub span{font-size:.26rem}.gn-syr-needle{width:12px;height:.8px}.gn-syr-results{grid-template-columns:1fr}.gn-syr-scale-bottom{padding:0 22px 0 20px;font-size:.4rem}.gn-syr-pk-hud{grid-template-columns:1fr}.syringe-visual{overflow:hidden}
