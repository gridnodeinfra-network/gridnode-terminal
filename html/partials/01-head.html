<style id="gn-critical-legacy">
/* Critical subset of css/native/12-legacy-externalized.css (HTML diet,
 * 2026-10-13): the legacy rules that style first-paint surfaces (landing,
 * boot, login, global base), extracted verbatim and in original order so
 * first paint is never gated on the full 370 KB legacy layer. The full file
 * below loads async and re-applies these same rules; this duplication is
 * the standard critical-CSS pattern. #app stays visibility-gated until the
 * full layer lands (or a 2.8s fallback), so no app screen can flash
 * unstyled. Do not edit here: edit the source file and re-extract. */
:root {
  --cyan:      #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.12);
  --cyan-glow: rgba(0,212,255,0.4);
  --red-hi: #FF5B5B;
  --red-lo: #D12424;
  --red:       #FF3B3B;
  --red-dim:   rgba(255,59,59,0.12);
  --red-glow: rgba(255, 59, 59, 0.35);
  --red-dim:  rgba(255,59,59,0.4);
  --green:     #00ff88;
  --green-dim: rgba(0,255,136,0.12);
  --yellow:    #ffd700;
  --cp-yellow: #FCEE0A;  /* Cyberpunk 2077 yellow, accent labels only */
  --yellow-dim:rgba(255,215,0,0.12);
  --orange:    #ff8c00;
  --magenta:   #ff00cc;
  /* S2 — TRUST GRAMMAR tokens. Semantics are structural (solid/dashed/outlined),
     never color-only. RECORDED = measured fact (cyan, solid). ESTIMATE = modeled
     or calculated (amber, dashed/segmented, approximate language). PLAN = user
     schedule or intended action (violet, outlined). STATUS = operational state. */
  --trust-recorded-accent: #00d4ff;
  --trust-recorded-border: rgba(0,212,255,.55);
  --trust-recorded-bg:     rgba(0,212,255,.07);
  --trust-estimate-accent: #ffb300;
  --trust-estimate-border: rgba(255,179,0,.55);
  --trust-estimate-bg:     rgba(255,179,0,.06);
  --trust-plan-accent:     #9d7bff;
  --trust-plan-border:     rgba(157,123,255,.55);
  --trust-plan-bg:         rgba(157,123,255,.06);
  --trust-status-ok:       #00ff88;
  --trust-status-warn:     #ffb300;
  --trust-status-err:      #ff5b5b;
  --trust-status-mute:     #9898b0;
  --bg:        #050508;
  --bg2:       #08080d;
  --panel:     #0e0e16;
  --panel2:    #121218;
  --panel3:    #161622;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --text:      #eeeef5;
  --text-mid:  #9898b0;
  --text-dim:  #6f6f88;
  --font-d:    'Orbitron', monospace;
  --font-m:    'Share Tech Mono', monospace;
  --font-b:    'Rajdhani', sans-serif;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --r: 6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:16px}
.scanlines{position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.02) 3px,rgba(0,0,0,0.02) 4px);opacity:.7}
.scan-sweep{position:fixed;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.028),transparent);z-index:9998;pointer-events:none;animation:sweepDown 14s linear infinite;opacity:.55}
@keyframes sweepDown{0%{top:-1%}100%{top:101%}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex;animation:fadeIn 0.4s ease}

.boot-terminal{width:100%;max-width:320px;background:#0e0e16;background:var(--panel, #0e0e16);border:1px solid var(--border2);padding:14px;margin-bottom:20px;min-height:130px}
.boot-prog-wrap{width:100%;max-width:320px;margin-bottom:10px}
.boot-prog-track{height:2px;background:var(--border2);overflow:hidden}
.boot-prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 8px var(--cyan);transition:width 0.15s ease}
.boot-prog-pct{font-family:var(--font-m);font-size:0.68rem;color:var(--cyan);text-align:right;margin-top:6px}
#login{align-items:center;justify-content:flex-start;padding:24px;overflow-y:auto;height:100vh;height:100svh}
#login>div{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;margin:auto}

.overlay.active{display:flex}

.toast{position:fixed;bottom:calc(84px + var(--safe-bottom));left:14px;right:14px;z-index:400;background:var(--panel2);border:1px solid var(--green);border-left:3px solid var(--green);padding:13px 15px;font-family:var(--font-b);font-size:1rem;color:var(--green);box-shadow:0 4px 20px rgba(0,255,136,0.12);display:none;animation:slideUp 0.3s ease;border-radius:var(--r)}

  color:var(--cyan);

}

.landing-hero{justify-content:flex-start;min-height:auto;padding-top:18px;padding-bottom:26px;gap:18px}
.landing-headline{text-align:left;font-size:clamp(2rem,10vw,2.55rem)}
.landing-copy{max-width:100%;font-size:1.05rem}
.landing-cta-row{grid-template-columns:1fr;width:100%}
.landing-btn{width:100%}
.landing-note{font-size:.55rem;letter-spacing:.8px}
}
@media(max-width:360px) {
.landing-logo{font-size:clamp(1.72rem,9.4vw,2.05rem);letter-spacing:1px}
.landing-kicker{font-size:.52rem;letter-spacing:1.25px}
.landing-headline{font-size:clamp(1.85rem,9.5vw,2.2rem)}
.landing-copy{font-size:1.02rem}
.landing-btn{font-size:.68rem;letter-spacing:1.5px}
.landing-note{font-size:.52rem;letter-spacing:.55px}
}
.gn-glyph-defs{position:absolute;width:0;height:0;overflow:hidden}
.nav-item.active .gn-icon{filter:drop-shadow(0 0 7px rgba(0,212,255,.55))}
.scanner-mode-btn.active{
  color:#031318;
  border-color:rgba(0,212,255,.9);
  background:linear-gradient(180deg,rgba(0,212,255,.95),rgba(0,180,220,.85));
  box-shadow:0 0 18px rgba(0,212,255,.35), inset 0 1px 0 rgba(255,255,255,.25);
  text-shadow:none;
  font-weight:700;
}
@keyframes biotechStageIn{
  from{opacity:0;transform:scale(.985)}
  to{opacity:1;transform:scale(1)}
}
.biotech-stage.active .biotech-stage-frame{animation:biotechStageIn .28s ease-out}
@media (prefers-reduced-motion:reduce) {
.biotech-stage.active .biotech-stage-frame{animation:none}
}
.scanner-skin-btn.active{
  color:var(--cp-yellow);
  border-color:rgba(252,238,10,.55);
  background:rgba(252,238,10,.08);
  box-shadow:0 0 12px rgba(252,238,10,.18), inset 0 0 10px rgba(252,238,10,.05);
  text-shadow:0 0 6px rgba(252,238,10,.35);
}
.nav-item.active .nav-ico,
.nav-item.active .nav-lbl{
  color:var(--cyan);
}
.shots-safety-note,
.results-safety,
.landing-note,
.phase-edu-note{
  color:#a7cbd5;
}
.boot-prog-pct{font-size:.60rem;letter-spacing:2px;text-align:center;color:#8fbecb;text-transform:uppercase}
.gn-date-overlay.active,.csv-import-overlay.active{display:flex;animation:fadeIn .18s ease}
html[data-theme="light"] .csv-import-row{background:rgba(255,255,255,.6);border-color:rgba(0,111,130,.2)}
html[data-theme="light"] .csv-import-notimported{border-color:rgba(0,111,130,.25)}
@media (prefers-reduced-motion: reduce) {
.gn-date-overlay.active,.csv-import-overlay.active{animation:none}
}
.gn-import-overlay.active{display:flex;animation:fadeIn .18s ease}
@media (prefers-reduced-motion: reduce) {
.gn-import-overlay.active{animation:none}
}
.results-weight-unit.active{
  border-color:rgba(0,255,136,.55);
  color:#c7ffd9;
  background:linear-gradient(135deg,rgba(0,255,136,.15),rgba(0,212,255,.05));
  box-shadow:0 0 15px rgba(0,255,136,.10), inset 0 0 12px rgba(0,255,136,.05);
}
