<div class="screen" id="boot" role="main">
  <div class="boot-command-deck" role="status" aria-live="polite" aria-label="GRID//NODE Personal Biotech Operating System initialization">
    <div class="boot-deck-kicker"><span data-i18n="boot.kicker">PERSONAL BIOTECH OPERATING SYSTEM</span><b data-i18n="boot.statusInitializing">INITIALIZING</b></div>
    <div class="boot-b2b-stack" aria-label="GRID//NODE startup">
    <div class="boot-b2b-symbol-wrap"><img class="gn-b2b-symbol" src="/assets/brand/ui/boot-mark.svg" alt="GRID//NODE B2-B primary color symbol" width="1024" height="1024" decoding="async"></div>
    <div class="boot-b2b-wordmark-wrap"><img class="gn-b2b-wordmark" src="/assets/brand/ui/header-lockup.svg" alt="GRID//NODE color wordmark" width="1600" height="320" decoding="async"></div>
    <div class="boot-slogan" data-i18n="boot.tagline">Your body. Your data. Your grid.</div>
  </div>
  <div class="boot-terminal boot-hud-startup" id="bootTerm"></div>
  <div class="boot-prog-wrap">
    <div class="boot-prog-track" id="bootBar"><div class="boot-prog-fill"><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div><div class="boot-prog-seg"></div></div></div>
    <div class="boot-prog-pct" id="bootPct">000% // PERSONAL BIOTECH OS</div>
  </div>
    <div class="boot-deck-footer"><span data-i18n="boot.footerLeft">LOCAL-FIRST DATA CORE</span><i></i><span data-i18n="boot.footerRight">OPERATOR SESSION</span></div>
  </div>
</div>


<div class="screen" id="login" role="main">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:0">

    
    <svg width="200" height="38" viewBox="0 0 200 38" fill="none" style="margin-bottom:12px">
      <text x="0" y="30" font-family="Orbitron,monospace" font-weight="900" font-size="24" letter-spacing="5" fill="#00d4ff">GRID</text>
      <text x="100" y="30" font-family="Orbitron,monospace" font-weight="900" font-size="24" fill="#FF3B3B">//</text>
      <text x="126" y="30" font-family="Orbitron,monospace" font-weight="900" font-size="24" letter-spacing="5" fill="#00d4ff">NODE</text>
    </svg>

    
    <div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;color:#9898b0;letter-spacing:1px;margin-bottom:6px;text-align:center">
      Your body. Your data. Your grid.
    </div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:0.58rem;color:var(--text-dim);letter-spacing:3px;margin-bottom:48px;text-align:center">
      // BIOTECH TRACKING FOR THE NEXT GENERATION //
    </div>

    
    <button id="loginGoogleBtn" onclick="handleGoogleSignIn()" style="
      width:100%;max-width:320px;height:56px;
      background:transparent;
      border:1px solid rgba(0,212,255,0.5);
      border-radius:6px;
      color:#00d4ff;
      font-family:'Orbitron',monospace;
      font-size:0.82rem;font-weight:700;letter-spacing:3px;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:12px;
      transition:all 0.2s;
      margin-bottom:16px;
    ">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      CONTINUE WITH GOOGLE
    </button>

    
    <div id="loginMsg" style="font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:var(--text-dim);letter-spacing:2px;text-align:center;min-height:20px"></div>

    
    <div style="position:absolute;bottom:32px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--text-dim);letter-spacing:1px;line-height:2">
      BY CONTINUING: TERMS + PRIVACY APPLY
      <span style="color:var(--text-dim)">TERMS</span> · <span style="color:var(--text-dim)">PRIVACY</span>
    </div>

  </div>
</div>
